[platformio]
default_envs = m5sticks3
src_dir = main

[env:m5sticks3]
; Pinned to 6.13.0 = ESP-IDF 5.5.3. ESP-IDF 6.0.1 (platform 7.x) has a regression
; that wedges runtime PSRAM reads after a flash op on the shared MSPI of this
; Octal-PSRAM module (proven: identical config works on the Arduino/IDF-4.4.7 stack).
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
extra_scripts =
    pre:scripts/pio_fatfs.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    ; NOTE: -mfix-esp32-psram-cache-issue removed — it is an ESP32-ORIGINAL-only
    ; erratum workaround (invalid for ESP32-S3) and injects cache-access codegen
    ; that wedged i2c_master init under Octal PSRAM.
monitor_filters =
    esp32_exception_decoder
    time
