version: 1.0.0

devices:
  - name: display_lcd
    chip: st7789
    type: display_lcd
    version: default
    sub_type: spi
    config:
      invert_color: true
      need_reset: true
      x_max: 240
      y_max: 240
      io_spi_config:
        cs_gpio_num: 34
        dc_gpio_num: 45
        spi_mode: 0
        pclk_hz: 20000000
      lcd_panel_config:
        reset_gpio_num: 33
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
        flags:
          reset_active_high: false
    peripherals:
      - name: spi_master

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight

  - name: lcd_touch
    chip: cst816s
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_cst816s: "*"
    config:
      touch_config:
        x_max: 240
        y_max: 240
        int_gpio_num: 47
        rst_gpio_num: 48
    peripherals:
      - name: i2c_master
        i2c_addr: [0x2A]

  - name: buttons
    chip: gpio_button
    type: custom
    version: default
    init_skip: true
    config:
      button1_gpio: 17 # KEY 按键
      button2_gpio: 0 # BOOT 按键
      active_level: 0

  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    version: default
    config:
      sub_config:
        cs_gpio_num: 21
    peripherals:
      - name: spi_master

  - name: camera
    type: camera
    version: default
    sub_type: dvp
    config:
      dvp_config:
        reset_io: 3
        vsync_io: 4
        de_io: 5
        pclk_io: 10
        xclk_io: 7
        data_io:
          data_io_0: 12
          data_io_1: 14
          data_io_2: 15
          data_io_3: 13
          data_io_4: 11
          data_io_5: 9
          data_io_6: 8
          data_io_7: 6
    peripherals:
      - name: i2c_master
        frequency: 100000

  - name: camera_ir_filter
    version: default
    type: gpio_ctrl
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - name: gpio_16

  - name: audio_adc
    chip: internal
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 2
      adc_channel_mask: "0011"
      adc_init_gain: 6
      mclk_enabled: false
    peripherals:
      - name: i2s_audio_in

  - name: audio_dac
    chip: internal
    type: audio_codec
    version: default
    config:
      dac_enabled: true
      dac_max_channel: 1
      adc_channel_mask: "1"
      adc_init_gain: 0
      mclk_enabled: false
    peripherals:
      - name: i2s_audio_out
