version: 1.0.0

peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 1
        scl: 2

  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 46
      freq_hz: 5000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: false

  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config:
      sample_rate_hz: 16000
      clk_src: I2S_CLK_SRC_DEFAULT
      ext_clk_freq_hz: 0
      mclk_multiple: 256
      data_bit_width: 16
      slot_mode: I2S_SLOT_MODE_MONO
      pins:
        bclk: 18
        ws: 39
        din: 40
      invert_flags:
        mclk_inv: false
        bclk_inv: false
        ws_inv: true
      port: 0

  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config:
      sample_rate_hz: 11025
      clk_src: I2S_CLK_SRC_DEFAULT
      ext_clk_freq_hz: 0
      mclk_multiple: 256
      data_bit_width: 16
      slot_mode: I2S_SLOT_MODE_STEREO
      pins:
        bclk: 41
        ws: 42
        dout: 38
      invert_flags:
        mclk_inv: false
        bclk_inv: false
        ws_inv: false
      port: 1

  - name: spi_master
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI3_HOST
        data0_io_num: 35
        data1_io_num: 37
        sclk_io_num: 36
        max_transfer_sz: 115200 # 240 * 240 * 2 (full frame RGB565)

  - name: gpio_16
    type: gpio
    config:
      pin: 16
      mode: GPIO_MODE_OUTPUT
      default_level: 0
