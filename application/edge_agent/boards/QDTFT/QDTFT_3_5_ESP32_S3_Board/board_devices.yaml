# Devices Configuration for QDTFT 3.5 ESP32-S3 Board
version: 1.0.0
devices:

  # LCD: ST77922 320x480 via QSPI
  - name: display_lcd
    chip: st77922
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_st77922: "*"
    config:
      mirror_x: false
      mirror_y: false
      x_max: 320
      y_max: 480
      invert_color: false
      need_reset: true
      io_spi_config:
        cs_gpio_num: 10
        dc_gpio_num: -1
        spi_mode: 0
        pclk_hz: 40000000
        lcd_cmd_bits: 32
        lcd_param_bits: 8
        flags:
          quad_mode: true
      lcd_panel_config:
        reset_gpio_num: -1
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        bits_per_pixel: 16
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        flags:
          reset_active_high: false
        vendor_config: NULL
    peripherals:
      - name: spi_master

  # LCD Brightness Control via LEDC
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - name: ledc_backlight

  # LED strip: 1x WS2812
  - name: led_strip
    chip: ws2812
    type: custom
    version: default
    init_skip: true
    dependencies:
      espressif/led_strip:
        version: "^3.0"
        public: true
    config:
      max_leds: 1
    peripherals:
      - name: rmt_tx
