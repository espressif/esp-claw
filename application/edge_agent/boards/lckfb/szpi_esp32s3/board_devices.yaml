version: 1.0.0
# Devices for LCKFB SZPI ESP32-S3 (立创·实战派 ESP32-S3)
#
# The PCA9557 IO expander must be initialized first: it drives LCD_CS (IO0),
# PA_EN (IO1) and DVP_PWDN (IO2). setup_device.c keeps LCD_CS low, enables the
# speaker amplifier and powers the camera, so later devices need no extra hooks.

devices:

  # PCA9557 8-bit I2C IO expander @0x19.
  # Driven by the board's setup_device.c (custom device, no external component).
  - name: pca9557
    chip: pca9557
    type: custom
    version: 1.0.0
    config:
      i2c_addr: 0x19
      frequency: 100000
    peripherals:
      - name: i2c_master

  # Audio DAC: ES8311 (playback + speaker amplifier enable via PCA9557 PA_EN)
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
      dac_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 100000

  # Audio ADC: ES7210 (2 microphones + 1 playback reference channel for AEC)
  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 4
      adc_channel_mask: "0111"
      adc_channel_labels: ['NA', 'RE', 'FR', 'FL']
      adc_init_gain: 0
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x82
        frequency: 100000

  # ST7789 2.0" IPS LCD, 240x320, SPI. CS is held low by the PCA9557.
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: true
      mirror_y: false
      swap_xy: true
      x_max: 320
      y_max: 240
      invert_color: true
      need_reset: false
      io_spi_config:
        cs_gpio_num: -1
        dc_gpio_num: 39
        spi_mode: 2
        pclk_hz: 80000000
        trans_queue_depth: 10
      lcd_panel_config:
        reset_gpio_num: -1
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        bits_per_pixel: 16
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
    peripherals:
      - name: spi_display

  # LCD backlight brightness (LEDC)
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight

  # FT6336 capacitive touch controller (I2C, no RST/INT wired)
  - name: lcd_touch
    chip: ft5x06
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_ft5x06: "^1.0.0"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 100000
      touch_config:
        x_max: 240
        y_max: 320
        flags:
          swap_xy: true
          mirror_x: true
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0x70]

  # MicroSD (TF) card in 1-bit SD mode: CLK=IO47, CMD=IO48, D0=IO21
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      sub_config:
        bus_width: 1
        slot_flags: SDMMC_SLOT_FLAG_INTERNAL_PULLUP
        pins:
          clk: 47
          cmd: 48
          d0: 21

  # GC0308 DVP camera. PWDN is controlled by the PCA9557 (DVP_PWDN), so it is
  # not a SoC GPIO here.
  - name: camera
    type: camera
    sub_type: dvp
    version: default
    config:
      dvp_config:
        reset_io: -1
        pwdn_io: -1
        vsync_io: 3
        data_width: CAM_CTLR_DATA_WIDTH_8
        de_io: 46
        pclk_io: 7
        xclk_io: 5
        xclk_freq: 20000000
        data_io:
          data_io_0: 16
          data_io_1: 18
          data_io_2: 8
          data_io_3: 17
          data_io_4: 15
          data_io_5: 6
          data_io_6: 4
          data_io_7: 9
    peripherals:
      - name: i2c_master
        frequency: 100000

  # QMI8658 6-axis IMU (I2C @0x6A). Config-only custom device consumed by the
  # Lua `imu` module (QMI8658 backend added under lua_module_imu).
  - name: imu_sensor
    chip: qmi8658
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      i2c_addr: 0x6A
      frequency: 100000
      int_gpio_num: -1
      sdo_gpio_num: -1
    peripherals:
      - name: i2c_master

  # BOOT / user button (IO0, active low). Exposed through the BMGR button device;
  # Lua scripts can also read it via the `button` module on GPIO0.
  - name: boot_button
    type: button
    sub_type: gpio
    config:
      active_level: 0
      disable_pull: false
    peripherals:
      - name: gpio_button_boot
