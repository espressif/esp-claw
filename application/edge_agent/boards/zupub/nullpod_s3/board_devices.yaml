version: 1.0.0
# Devices Configuration for NullPod (ESP32-S3)
#
# ESP-Claw requires display_lcd (emote / display_arbiter / Lua LCD module),
# lcd_touch (Lua lcd_touch module) and fs_sdcard (writable storage root).
# Backlight and the power latch are owned by the board manager as well.
# The power key supervisor is a board-specific custom device (power_key.c).
#
# The BMI270 IMU and the IR blaster are declared as "init_skip" custom devices:
# nothing is initialised at boot, the descriptors only carry the pin/address
# defaults that the Lua imu/ir modules read via imu.new() / ir.new(). The struct
# field order is reproduced by lua_imu_board_cfg_t (lua_module_imu.c) and
# lua_ir_board_cfg_t (lua_module_ir.c) and is size-checked at runtime, so keep
# the key names, order and integer widths below in sync when editing.
# The remaining chips on the shared I2C bus (QMC5883P magnetometer, PCF8563
# RTC, BMP280 barometer) have no Lua backend yet and are not declared here.
# Keys, rotary encoder, RGB LED, buzzer and battery ADC are driven straight from
# Lua by pin number (see the nullpod_controls skill).

devices:
  # ST7789 240x280 IPS panel on SPI2.
  # The controller frame memory is 240x320, so the visible 280 rows are centred
  # with a 20-row Y gap (see esp_lcd_panel_set_gap() in setup_device.c).
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    # No managed component needed: ESP-IDF ships esp_lcd_panel_st7789 as part
    # of the esp_lcd component (see setup_device.c).
    config:
      x_max: 240
      y_max: 280
      swap_xy: false
      mirror_x: false
      mirror_y: false
      invert_color: true
      need_reset: true
      io_spi_config:
        cs_gpio_num: 5
        dc_gpio_num: 4
        spi_mode: 0
        pclk_hz: 40000000
      lcd_panel_config:
        reset_gpio_num: 8
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
    peripherals:
      - name: spi_display

  # LCD backlight brightness (0-100 %) over LEDC PWM on GPIO15.
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 80
    peripherals:
      - name: ledc_backlight

  # CST816S capacitive touch on the shared I2C bus (7-bit address 0x15).
  # The driver lives in espressif/esp_lcd_touch_cst816s and is wired up through
  # lcd_touch_factory_entry_t() in setup_device.c.
  - name: lcd_touch
    chip: cst816s
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_cst816s: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        lcd_param_bits: 0
        scl_speed_hz: 400000
        flags:
          disable_control_phase: true
      touch_config:
        x_max: 240
        y_max: 280
        rst_gpio_num: 13
        int_gpio_num: 14
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0x2A]   # 7-bit 0x15 shifted left by one (8-bit address)

  # SD card on SPI3. The device name must stay "fs_sdcard": app_fs uses it to
  # prefer the card as the writable storage root when one is inserted.
  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 41
        frequency: SDMMC_FREQ_DEFAULT
    peripherals:
      - name: spi_sdcard

  # Long-press power-off supervisor. The board manager owns the key/hold pins
  # as peripherals; this custom device (power_key.c) starts a poll task that
  # releases the hardware power latch (PWR_HOLD) after `long_press_ms`, cutting
  # the rail and switching the board off. 2 s matches the stock firmware.
  - name: power_key
    chip: nullpod_pwr
    type: custom
    version: default
    config:
      key_gpio_num: 17
      hold_gpio_num: 18
      long_press_ms: 2000
      poll_interval_ms: 20
    peripherals:
      - name: gpio_pwr_key
      - name: gpio_pwr_hold

  # BMI270 6-axis IMU on the shared I2C bus (7-bit address 0x68, SDO strap high).
  # No interrupt pin and no SDO strap pin are wired, hence -1 in both fields.
  # Consumed by `imu.new()` from the lua_module_imu BMI270 backend.
  - name: imu_sensor
    chip: bmi270
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      i2c_addr: 0x68
      frequency: 400000
      int_gpio_num: -1
      sdo_gpio_num: -1
    peripherals:
      - name: i2c_master

  # 940 nm IR transmitter on GPIO42 (TX only, no receiver and no enable pin).
  # Consumed by `ir.new()` from the lua_module_ir RMT backend.
  - name: ir_blaster
    chip: rmt_ir
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      tx_gpio_num: 42
      rx_gpio_num: -1
      ctrl_gpio_num: -1
      ctrl_active_level: 0
      carrier_hz: 38000
