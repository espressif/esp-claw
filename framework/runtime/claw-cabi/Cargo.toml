[package]
name = "claw-cabi"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "C adapter boundary for the Rust agent runtime"

[lib]
name = "claw_cabi"
crate-type = ["staticlib", "rlib"]

[dependencies]

[target.'cfg(target_os = "espidf")'.dependencies]
claw-agent = { path = "../claw-agent" }
claw-api = { path = "../claw-api" }
claw-core = { path = "../claw-core" }
claw-interface = { path = "../claw-interface" }
claw-sys = { path = "../claw-sys" }
claw-tool = { path = "../claw-tool" }
edge-executor = { version = "0.4.1", default-features = false }
# Vetted async MPMC channel (smol family, same lineage as `edge-executor`) for
# the FFI->worker command queue, replacing the hand-rolled `claw_utils` channel.
async-channel = "2"
# The `Stream` trait so the worker loop can poll the command `Receiver` directly.
futures-core = "0.3"
# `block_on` for the executor entry point (smol family; edge-executor only
# re-exports it under its `std` feature, which we keep off).
futures-lite = "2"
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
