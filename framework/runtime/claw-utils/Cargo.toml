[package]
name = "claw-utils"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Shared utilities: log-safe text truncation and the prefixed-id newtype macro"

[lib]
name = "claw_utils"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
