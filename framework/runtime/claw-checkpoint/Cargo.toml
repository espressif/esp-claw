[package]
name = "claw-checkpoint"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Checkpoint interfaces for durable runtime state"

[lib]
crate-type = ["rlib"]

[dependencies]
claw-interface = { path = "../claw-interface" }
claw-utils = { path = "../claw-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
claw-interface = { path = "../claw-interface", features = ["memfs"] }
