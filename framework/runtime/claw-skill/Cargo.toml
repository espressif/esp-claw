[package]
name = "claw-skill"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Filesystem-backed skill registry and per-agent catalog/document activation cache"

[dependencies]
claw-interface = { path = "../claw-interface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Filesystem backends for host-target tests: `memfs` is the hermetic test double,
# `diskfs` reads the data-driven golden fixtures from the checkout.
claw-interface = { path = "../claw-interface", features = ["memfs", "diskfs"] }
# Ergonomic error handling for host dev workflow examples; never in firmware.
anyhow = "1"
