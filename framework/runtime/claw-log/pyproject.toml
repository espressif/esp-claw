[project]
name = "claw-trace"
version = "0.1.0"
description = "Parser and tree reconstructor for claw-log's flat-tree TRACE format (see docs/trace-format.md)."
readme = "scripts/README.md"
requires-python = ">=3.11"
dependencies = [
    "chrometrace>=0.2.1",
    # Live-capture glue tool (claw-trace-capture) drives a monitor via serial-log.
    "serial-log",
]

[tool.uv.sources]
serial-log = { path = "scripts/serial_log", editable = true }

[project.scripts]
# Capture a live TRACE log from a monitor command and export Chrome trace JSON
# (serial-log -> claw_trace -> chrome_export).
claw-trace-capture = "trace_capture.__main__:main"
# Convert an existing TRACE .log file (or stdin) to Chrome trace JSON offline.
claw-trace-chrome = "chrome_export.__main__:main"
# claw_trace stays an importable library; its __main__ module remains runnable
# via `python -m claw_trace` but is intentionally not registered as a console
# script.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The library lives under scripts/ rather than the conventional src/. The chrome
# exporter and the live-capture glue are separate top-level packages next to it
# (not part of the lib).
packages = ["scripts/claw_trace", "scripts/chrome_export", "scripts/trace_capture"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]
