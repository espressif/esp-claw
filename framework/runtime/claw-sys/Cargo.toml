[package]
name = "claw-sys"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Thin IDF shims std cannot express: the ESP_LOGx log backend and the esp_http_client ClawHttp driver"

[lib]
crate-type = ["rlib"]

[dependencies]
claw-interface = { path = "../claw-interface" }
# Only the `Level` enum, and only on the device path: the level vocabulary for
# the `espidf`-only `log_sink::write` bridge. The `log` facade backend and the
# host stderr fallback both live in `claw-log`.
log = "0.4"
serde_json = "1"

# Host-target builds use claw-interface's `StdThread` for the `spawn_worker`
# fallback; the ESP-IDF target uses the in-crate `EspIdfThread` instead.
[target.'cfg(not(target_os = "espidf"))'.dependencies]
claw-interface = { path = "../claw-interface", features = ["stdthread"] }

# Device-only executor backend (`EspIdfExecutor`): the cooperative single-thread
# executor + `block_on` the orchestrator worker drives its `!Send` engine with.
[target.'cfg(target_os = "espidf")'.dependencies]
edge-executor = { version = "0.4.1", default-features = false }
futures-lite = "2"
