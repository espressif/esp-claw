[package]
name = "claw-sys-selftest"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Device-only C-ABI scenario runners that exercise claw-sys (log sink, threads, sync + async esp_http_client) from an ESP-IDF Unity test app"
publish = false

[lib]
# Built into libclaw_sys_selftest.a and linked into the ESP-IDF test app as an
# imported static component (see ../main/CMakeLists.txt). The whole crate is
# gated `#![cfg(target_os = "espidf")]`, so a host `cargo build --workspace`
# produces an empty archive and stays green.
name = "claw_sys_selftest"
crate-type = ["staticlib"]

[dependencies]
claw-sys = { path = "../../../" }
claw-interface = { path = "../../../../claw-interface" }
# Only the `Level` enum, to name the levels handed to `claw_sys::log_sink::write`.
log = "0.4"
# Lightweight async executor. Uses lock-free crossbeam queue + async-task (same
# foundation as smol). Supports no_std via features=["heapless"] for future
# bare-metal migration; use default (std) for ESP-IDF.
edge-executor = { version = "0.4.1", default-features = true }
