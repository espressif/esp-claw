[package]
name = "claw-tool"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Tool framework: model-callable tools, aggregation, gating, execution, and the build-time bake contract"

[lib]
name = "claw_tool"
# Pure-Rust rlib bundled (with the other logic crates) into the single `claw_rt`
# staticlib that the firmware links.
crate-type = ["rlib"]

[dependencies]
claw-permission = { path = "../claw-permission" }
claw-utils = { path = "../claw-utils" }
# Used only by the build-time `bake` module (called from dependent crates' build
# scripts). Nothing in the firmware call graph references `bake`, so the linker
# garbage-collects it and its `anyhow` usage out of the device image.
anyhow = "1"
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
