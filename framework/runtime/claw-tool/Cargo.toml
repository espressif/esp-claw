[package]
name = "claw-tool"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Tool registry, tool set projection, and tool runner"

[lib]
crate-type = ["rlib"]

[features]
# Host-only validation used by build scripts that bake tool resources.
build-support = ["dep:anyhow"]

[dependencies]
anyhow = { version = "1", optional = true }
claw-checkpoint = { path = "../claw-checkpoint" }
claw-permission = { path = "../claw-permission" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
