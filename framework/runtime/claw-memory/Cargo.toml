[package]
name = "claw-memory"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Agent memory subsystem: conversation tape and compaction"

[lib]
crate-type = ["rlib"]

[features]
# `NoopCompactor`: a never-compacts stub for host CLIs and tests (host-only).
compactor-stub = []

[dependencies]
# Core crate: depends only on the inbound trait crate plus `claw-utils` (for the
# shared `SharedTaskPool`). The concrete `ClawFs` and `Compactor` (e.g.
# `claw_core::LlmCompactor`) are passed in by the caller, so this crate pulls in
# neither the platform boundary (`claw-sys`) nor the LLM client (`claw-api`).
claw-interface = { path = "../claw-interface" }
claw-utils = { path = "../claw-utils" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Host-only doubles shared from claw-interface (tests/examples/doctests only).
# diskfs-pretty implies diskfs and pretty-prints on-disk JSON for inspection;
# stdthread provides `StdThread`, the host spawner that examples/tests pass to
# `SharedTaskPool::new`. None of these reach the device build (dev-deps only).
claw-interface = { path = "../claw-interface", features = ["memfs", "diskfs-pretty", "stdthread"] }
# Ergonomic error handling for the `conversation` example (host-only).
anyhow = "1"
