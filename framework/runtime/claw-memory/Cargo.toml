[package]
name = "claw-memory"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Agent memory subsystem: conversation tape and compaction"

[lib]
crate-type = ["rlib"]

[features]
# `NoopCompactor`: a never-compacts stub for host-target CLIs and tests.
compactor-stub = []

[dependencies]
# Core crate: depends only on the inbound trait crate. The concrete `ClawFs` and
# `Compactor` (e.g. `claw_core::LlmCompactor`) are passed in by the caller, so
# this crate pulls in neither the platform boundary (`claw-sys`) nor the LLM
# client (`claw-api`).
claw-interface = { path = "../claw-interface" }
# Shared id/allocator macros (`define_id_allocator!` for the `TurnId` counter).
claw-utils = { path = "../claw-utils" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Host-target helpers for tests/examples/doctests: `memfs` is the hermetic test
# double, `diskfs-pretty` is a disk-backed inspection backend, and `stdthread`
# drives background work on the host target. None of these reach device builds.
claw-interface = { path = "../claw-interface", features = ["memfs", "diskfs-pretty", "stdthread"] }
# Ergonomic error handling for the host dev workflow `conversation` example.
anyhow = "1"
# `block_on` for the `Compactor` doctest (smol family; replaces the removed
# `claw_utils::block_on`).
futures-lite = "2"
