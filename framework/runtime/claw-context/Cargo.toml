[package]
name = "claw-context"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Context builder: assembles the LLM request context from memory, history, skills, and other providers"

[lib]
name = "claw_context"
# Pure-Rust rlib bundled (with the other logic crates) into the single `claw_rt`
# staticlib that the firmware links.
crate-type = ["rlib"]

[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
