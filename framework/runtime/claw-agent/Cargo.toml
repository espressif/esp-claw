[package]
name = "claw-agent"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Concise agent API over the orchestrator: build an agent system and submit session turns"

[lib]
name = "claw_agent"
path = "src/lib.rs"

# A minimal REPL that drives the whole agent system against a live LLM with
# on-disk memory. It uses the host-target backends (`AgentSystem::on_disk`) and
# dev workflow dependencies plus cache profiling, so both features are required.
[[bin]]
name = "claw-agent-chat"
path = "src/bin/claw-agent-chat.rs"
required-features = ["dev", "cache_profile"]

# The tool/submit reference example uses test doubles plus dev workflow deps.
[[example]]
name = "tool_submit_loop"
required-features = ["dev"]

[features]
# Concepts:
# - target selection is Cargo/rustc cfg (`target_os = "espidf"` vs host), not a
#   feature. The firmware path reaches ESP-IDF implementations through
#   `claw-cabi` + `claw-sys`.
# - `host-backends` enables host-target concrete implementations and the
#   `AgentSystem::on_disk` constructor.
# - `dev` is the shared local workflow bundle for examples and host tools.
# - `cache_profile` forwards provider usage support; `claw-agent-chat` requires it.
#
# Nothing is enabled by default so library/device consumers must choose their
# backend explicitly. Firmware uses
# `AgentSystem::<Filesystem, Http, Timer>::new(...)` with ESP-IDF backends
# injected by `claw-cabi`.
default = []
host-backends = [
    "claw-interface/host-backends",
]
dev = [
    "host-backends",
    "dep:claw-log",
    "dep:dotenvy",
    "dep:anyhow",
    "dep:tokio",
    "dep:futures-lite",
    "dep:anstyle",
]
# Provider token/cache usage diagnostics, kept separate from `dev` so examples
# and other host workflows do not enable it implicitly.
cache_profile = [
    "claw-api/cache_profile",
    "claw-core/cache_profile",
]

[dependencies]
claw-core = { path = "../claw-core" }
claw-api = { path = "../claw-api" }
claw-checkpoint = { path = "../claw-checkpoint" }
claw-tool = { path = "../claw-tool" }
# Conversation/long-term memory. The compaction policy is wired internally
# (the LLM-backed `LlmCompactor`), so no stub-compactor feature is needed.
claw-memory = { path = "../claw-memory" }
# The DI trait surface (`ClawFs` / `ClawHttp`) is always available; concrete
# host-target backends are pulled in only by `host-backends`/`dev`, so the device
# build (via claw-cabi) stays free of reqwest/std-thread.
claw-interface = { path = "../claw-interface" }
claw-log = { path = "../claw-log", optional = true }
thiserror = "2"
# Dev-only: ergonomic errors for the `claw-agent-chat` bin and the examples.
anyhow = { version = "1", optional = true }
# Dev-only: the `claw-agent-chat` bin loads `claw-core/.env.local`.
dotenvy = { version = "0.15", optional = true }
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "rt-multi-thread"], optional = true }
# Dev-only: `StreamExt` to drain the session event stream in the REPL/examples.
futures-lite = { version = "2", optional = true }
# Dev-only: colored, aligned event labels for the `claw-agent-chat` REPL.
anstyle = { version = "1", optional = true }

[dev-dependencies]
claw-context = { path = "../claw-context" }
claw-log = { path = "../claw-log" }
# In-memory fs + scripted HTTP doubles so the end-to-end tests run hermetically
# (no network, no API key) entirely through the public API; `stdthread` is the
# host-target executor backend used by agent tests.
claw-interface = { path = "../claw-interface", features = [
    "test-doubles",
    "diskfs",
    "stdthread",
    "tokioexecutor",
] }
claw-utils = { path = "../claw-utils" }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"
tempdir = "0.3"
