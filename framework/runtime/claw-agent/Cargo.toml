[package]
name = "claw-agent"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Concise agent API over the orchestrator: build an agent system and drive registered channels"

[lib]
name = "claw_agent"
path = "src/lib.rs"

# A minimal REPL that drives the whole agent system through a registered channel
# against a live LLM with on-disk memory. It uses the host-target backends
# (`AgentSystem::on_disk`) and dev workflow dependencies, so it is gated on the
# `dev` feature.
[[bin]]
name = "claw-agent-chat"
path = "src/bin/claw-agent-chat.rs"
required-features = ["dev"]

# The capability-loop reference example uses test doubles plus dev workflow deps.
[[example]]
name = "capability_loop"
required-features = ["dev"]

[features]
# Concepts:
# - target selection is Cargo/rustc cfg (`target_os = "espidf"` vs host), not a
#   feature. The firmware path reaches ESP-IDF implementations through
#   `claw-cabi` + `claw-sys`.
# - `host-backends` enables host-target concrete implementations and the
#   `AgentSystem::on_disk` constructor.
# - `dev` is a local workflow bundle for the REPL/examples: it includes
#   host-backends plus CLI/example dependencies.
#
# Nothing is enabled by default so library/device consumers must choose their
# backend explicitly. Firmware uses `AgentSystem::new::<F, H, Timer>(...)` with
# ESP-IDF backends injected by `claw-cabi`.
default = []
host-backends = [
    "claw-interface/host-backends",
]
dev = [
    "host-backends",
    "dep:dotenvy",
    "dep:anyhow",
    "dep:tokio",
]

[dependencies]
claw-core = { path = "../claw-core" }
claw-api = { path = "../claw-api" }
claw-skill = { path = "../claw-skill" }
claw-tool = { path = "../claw-tool" }
# The capability surface: callers register tools/channels as `Capability`s in a
# `Registry`; this crate bridges it onto the orchestrator and channel router.
claw-capability = { path = "../claw-capability" }
# Conversation/long-term memory. The compaction policy is wired internally
# (the LLM-backed `LlmCompactor`), so no stub-compactor feature is needed.
claw-memory = { path = "../claw-memory" }
# The DI trait surface (`ClawFs` / `ClawHttp`) is always available; concrete
# host-target backends are pulled in only by `host-backends`/`dev`, so the device
# build (via claw-cabi) stays free of reqwest/std-thread.
claw-interface = { path = "../claw-interface" }
thiserror = "2"
# Dev-only: ergonomic errors for the `claw-agent-chat` bin and the examples.
anyhow = { version = "1", optional = true }
# Dev-only: the `claw-agent-chat` bin loads `claw-core/.env.local`.
dotenvy = { version = "0.15", optional = true }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
claw-context = { path = "../claw-context" }
# In-memory fs + scripted HTTP doubles so the end-to-end tests run hermetically
# (no network, no API key) entirely through the public API; `stdthread` is the
# host-target executor backend used by capability/tool tests.
claw-interface = { path = "../claw-interface", features = ["test-doubles", "stdthread"] }
claw-utils = { path = "../claw-utils" }
serde_json = "1"
