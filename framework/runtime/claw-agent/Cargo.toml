[package]
name = "claw-agent"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Concise agent API over the orchestrator: build an agent system, create a session, send messages, get replies"

[lib]
name = "claw_agent"
path = "src/lib.rs"

# A minimal REPL that drives the whole agent system through the public API
# (`AgentSystem::new_session` -> `AgentSystem::send`) against a live LLM with
# on-disk memory. It uses the dev backends (`AgentSystem::on_disk`), so it is
# gated on the `dev` feature.
[[bin]]
name = "claw-agent-chat"
path = "src/bin/claw-agent-chat.rs"
required-features = ["dev"]

# The capability-loop reference example uses the dev backends + `anyhow`.
[[example]]
name = "capability_loop"
required-features = ["dev"]

[features]
# Dev/test backends, ON by default. Bundles the injectable dev implementations
# (`DiskFs`, `RealHttp` (reqwest), `StdThread`) plus the conveniences built on
# them: `AgentSystem::on_disk`, the `claw-agent-chat` REPL bin, and the examples.
# Host consumers (CLI, tests, examples, the bin) get this batteries-included
# surface for free. The firmware C ABI (`claw-cabi`) instead sets
# `default-features = false` so reqwest/std-thread never reach the device image;
# it injects device backends through `AgentSystem::builder::<F, H>()`.
default = ["dev"]
dev = [
    "claw-interface/diskfs",
    "claw-interface/realhttp",
    "claw-interface/stdthread",
    "claw-interface/tokiotimer",
    "dep:dotenvy",
    "dep:anyhow",
    "dep:tokio",
]

[dependencies]
claw-core = { path = "../claw-core" }
claw-api = { path = "../claw-api" }
claw-skill = { path = "../claw-skill" }
claw-tool = { path = "../claw-tool" }
# The capability surface: callers register tools/channels as `Capability`s in a
# `Registry`; this crate bridges it onto the orchestrator's resolver/egress seams.
claw-capability = { path = "../claw-capability" }
# Conversation/long-term memory. The compaction policy is wired internally
# (the LLM-backed `LlmCompactor`), so no stub-compactor feature is needed.
claw-memory = { path = "../claw-memory" }
# The DI trait surface (`ClawFs` / `ClawHttp`) is always available; the concrete
# dev backends (`diskfs`/`realhttp`/`stdthread`) are pulled in only by the `dev`
# feature so the device build (via claw-cabi) stays free of reqwest/std-thread.
claw-interface = { path = "../claw-interface" }
thiserror = "2"
# Dev-only: ergonomic errors for the `claw-agent-chat` bin and the examples.
anyhow = { version = "1", optional = true }
# Dev-only: the `claw-agent-chat` bin loads `claw-core/.env.local`.
dotenvy = { version = "0.15", optional = true }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
# In-memory fs + scripted HTTP doubles so the end-to-end tests run hermetically
# (no network, no API key) entirely through the public API.
claw-interface = { path = "../claw-interface", features = ["memfs", "httpmock", "timermock"] }
claw-utils = { path = "../claw-utils" }
serde_json = "1"
