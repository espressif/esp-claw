[package]
name = "claw-agent-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host CLIs that drive claw agents against a live LLM with on-disk memory for off-device manual testing"

[lib]
name = "claw_agent_cli"
path = "src/lib.rs"

[[bin]]
name = "generic-agent-chat"
path = "src/generic_agent_cli.rs"

[[bin]]
name = "orchestrator-chat"
path = "src/orchestrator_cli.rs"

[dependencies]
claw-core = { path = "../claw-core" }
claw-log = { path = "../claw-log" }
claw-api = { path = "../claw-api" }
claw-memory = { path = "../claw-memory" }
claw-interface = { path = "../claw-interface", features = ["host-backends"] }
dotenvy = "0.15"
owo-colors = "4"
serde_json = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
