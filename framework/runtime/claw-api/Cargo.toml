[package]
name = "claw-api"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "OpenAI-/Anthropic-compatible LLM client chat + media"

[lib]
name = "claw_api"
crate-type = ["rlib"]

[dependencies]
claw-interface = { path = "../claw-interface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
# Host-target live HTTP backend (`RealHttp`) for the `#[ignore]`d live
# mock-endpoint integration tests, plus a hermetic timer double. Never in the
# firmware lib build.
claw-interface = { path = "../claw-interface", features = ["realhttp", "timermock"] }
# Ergonomic error handling for host-target doc-tests and the chat example.
anyhow = "1"
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
