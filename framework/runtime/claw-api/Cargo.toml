[package]
name = "claw-api"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "OpenAI-/Anthropic-compatible LLM client chat + media"

[lib]
name = "claw_api"
crate-type = ["rlib"]

[features]
cache_profile = []

[dependencies]
claw-interface = { path = "../claw-interface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
futures-core = { version = "0.3", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
strum = { version = "0.28", features = ["derive"] }
# Shape-only attempt/retry spans consumed by the firmware's claw-log subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
# Host-target live HTTP backend (`RealHttp`) for the `#[ignore]`d live
# mock-endpoint integration tests, plus a hermetic timer double. Never in the
# firmware lib build.
claw-interface = { path = "../claw-interface", features = ["realhttp", "timermock", "httpmock"] }
# Ergonomic error handling for host-target doc-tests and the chat example.
anyhow = "1"
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"
tempdir = "0.3"
# Capturing subscriber used by the attempt/retry trace contract tests.
claw-log = { path = "../claw-log" }

[lints.rust]
unsafe_code = "forbid"
