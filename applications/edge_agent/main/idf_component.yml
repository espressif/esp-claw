## IDF Component Manager Manifest File
dependencies:
  espressif/esp_board_manager:
    version: "^0.5.12"
    public: true
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "2.12.3"
    rules:
      - if: "target in [esp32p4]"

  espressif2022/esp_emote_expression:
    version: "^1.0.0"

  espressif2022/esp_emote_gfx:
    version: "3.0.2"

  app_claw:
    path: ../../../applications/shared/app_claw

  app_config:
    path: ../components/app_config

  captive_dns:
    path: ../../../framework/services/network/captive_dns

  claw_ramfs:
    path: ../../../framework/foundation/claw_ramfs

  claw_utils:
    path: ../../../framework/foundation/claw_utils

  emote:
    path: ../../../applications/shared/emote
    rules:
      - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True

  http_reuse:
    path: ../../../framework/platform/esp_idf/http_reuse

  http_server:
    path: ../components/http_server

  settings_store:
    path: ../../../framework/services/settings_store

  wifi_manager:
    path: ../../../framework/services/network/wifi_manager

  esp_video:
    path: ../../../framework/platform/component_overrides/esp_video
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True
