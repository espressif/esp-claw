dependencies:
  boards:
    path: ../../../framework/capabilities/boards

  files:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_FILES} == True
    path: ../../../framework/capabilities/files

  im_platform:
    rules:
      - if: >-
          $CONFIG{APP_CLAW_CAP_IM_FEISHU} == True || $CONFIG{APP_CLAW_CAP_IM_QQ} == True ||
          $CONFIG{APP_CLAW_CAP_IM_TG} == True || $CONFIG{APP_CLAW_CAP_IM_WECHAT} == True
    path: ../../../framework/capabilities/im_platform

  im_local:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_IM_LOCAL} == True
    path: ../../../framework/capabilities/im_local

  llm_inspect:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LLM_INSPECT} == True
    path: ../../../framework/capabilities/llm_inspect

  lua_runtime:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
    path: ../../../framework/capabilities/lua_runtime

  mcp_client:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_MCP_CLIENT} == True
    path: ../../../framework/capabilities/mcp_client

  mcp_server:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_MCP_SERVER} == True
    path: ../../../framework/capabilities/mcp_server

  router_manager:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_ROUTER_MGR} == True
    path: ../../../framework/capabilities/router_manager

  scheduler:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_SCHEDULER} == True
    path: ../../../framework/capabilities/scheduler

  system:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_SYSTEM} == True
    path: ../../../framework/capabilities/system

  time:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_TIME} == True
    path: ../../../framework/capabilities/time

  http_request:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_HTTP_REQUEST} == True
    path: ../../../framework/capabilities/http_request

  web_search:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_WEB_SEARCH} == True
    path: ../../../framework/capabilities/web_search

  claw_cap:
    path: ../../../framework/foundation/claw_cap

  claw_utils:
    path: ../../../framework/foundation/claw_utils

  claw_event_router:
    path: ../../../framework/foundation/claw_event_router

  runtime:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_CORE} == True
    path: ../../../framework/runtime

  agent:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_CORE} == True
    path: ../../../framework/capabilities/agent

  skill_builder:
    path: ../../../framework/build_support/skill_builder

  lua_module_builder:
    path: ../../../framework/build_support/lua_module_builder

  emote:
    rules:
      - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True
      - if: $CONFIG{APP_CLAW_ENABLE_EMOTE} == True
    path: ../emote

  # --- lua_driver (hardware peripheral drivers) ---

  driver_adc:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_DRIVER_ADC} == True
    path: ../../../framework/lua_modules/driver_adc

  driver_gpio:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_DRIVER_GPIO} == True
    path: ../../../framework/lua_modules/driver_gpio

  driver_i2c:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_DRIVER_I2C} == True
    path: ../../../framework/lua_modules/driver_i2c

  driver_mcpwm:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_DRIVER_MCPWM} == True
    path: ../../../framework/lua_modules/driver_mcpwm

  driver_pcnt:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_DRIVER_PCNT} == True
    path: ../../../framework/lua_modules/driver_pcnt

  driver_touch:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_DRIVER_TOUCH} == True
    path: ../../../framework/lua_modules/driver_touch

  driver_uart:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_DRIVER_UART} == True
    path: ../../../framework/lua_modules/driver_uart

  # --- lua_module (higher-level modules) ---

  module_audio:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_AUDIO} == True
      - if: $CONFIG{ESP_BOARD_DEV_AUDIO_CODEC_SUPPORT} == True
    path: ../../../framework/lua_modules/module_audio

  module_board_manager:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_BOARD_MANAGER} == True
    path: ../../../framework/lua_modules/module_board_manager

  module_button:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_BUTTON} == True
    path: ../../../framework/lua_modules/module_button

  module_ble:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_BLE} == True
    path: ../../../framework/lua_modules/module_ble

  module_ble_hid:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_BLE_HID} == True
    path: ../../../framework/lua_modules/module_ble_hid

  module_camera:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_CAMERA} == True
      - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True
    path: ../../../framework/lua_modules/module_camera

  module_call_capability:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_CAPABILITY} == True
    path: ../../../framework/lua_modules/module_call_capability

  module_delay:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_DELAY} == True
    path: ../../../framework/lua_modules/module_delay

  module_display:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_DISPLAY} == True
    path: ../../../framework/lua_modules/module_display

  module_environmental_sensor:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_ENVIRONMENTAL_SENSOR} == True
    path: ../../../framework/lua_modules/module_environmental_sensor

  module_event_publisher:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_EVENT_PUBLISHER} == True
    path: ../../../framework/lua_modules/module_event_publisher

  module_http_server:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_HTTP_SERVER} == True
    path: ../../../framework/lua_modules/module_http_server

  module_json:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_JSON} == True
    path: ../../../framework/lua_modules/module_json

  module_thread:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_THREAD} == True
    path: ../../../framework/lua_modules/module_thread

  module_fuel_gauge:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_FUEL_GAUGE} == True
    path: ../../../framework/lua_modules/module_fuel_gauge

  module_image:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_IMAGE} == True
    path: ../../../framework/lua_modules/module_image

  module_imu:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_IMU} == True
    path: ../../../framework/lua_modules/module_imu

  module_ir:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_IR} == True
    path: ../../../framework/lua_modules/module_ir

  module_knob:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_KNOB} == True
    path: ../../../framework/lua_modules/module_knob

  module_lcd:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_LCD} == True
    path: ../../../framework/lua_modules/module_lcd

  module_lcd_touch:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_LCD_TOUCH} == True
      - if: $CONFIG{ESP_BOARD_DEV_LCD_TOUCH_SUPPORT} == True
      - if: $CONFIG{ESP_BOARD_DEV_LCD_TOUCH_SUB_I2C_SUPPORT} == True
    path: ../../../framework/lua_modules/module_lcd_touch

  module_led_strip:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_LED_STRIP} == True
    path: ../../../framework/lua_modules/module_led_strip

  module_lvgl:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_LVGL} == True
    path: ../../../framework/lua_modules/module_lvgl

  module_magnetometer:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_MAGNETOMETER} == True
    path: ../../../framework/lua_modules/module_magnetometer

  module_sci:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_SCI} == True
    path: ../../../framework/lua_modules/module_sci

  module_storage:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_STORAGE} == True
    path: ../../../framework/lua_modules/module_storage

  module_system:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_SYSTEM} == True
    path: ../../../framework/lua_modules/module_system

  module_vision:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_VISION} == True
      - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True
    path: ../../../framework/lua_modules/module_vision
