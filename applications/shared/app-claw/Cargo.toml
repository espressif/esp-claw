[package]
name = "app-claw"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Shared Rust app-claw wiring"

[lib]
name = "app_claw"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
default = []
stdio = ["debug-console/stdio"]
espidf = ["debug-console/espidf"]

[dependencies]
debug-console = { path = "../../../framework/services/debug-console" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
